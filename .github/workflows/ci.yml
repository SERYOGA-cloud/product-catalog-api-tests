name: CI

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
      - "feature/**"
      - "fix/**"
      - "ci/**"
      - "refactor/**"
      - "test/**"
      - "docs/**"
  workflow_dispatch:
    inputs:
      test_suite:
        description: "Test suite to run against live stand or contract stub (none | smoke | regression)"
        required: false
        default: "none"
        type: choice
        options:
          - none
          - smoke
          - regression
      use_local_mock:
        description: "Run against built-in OpenAPI contract stub (true) or live BASE_URL from secrets (false)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

jobs:
  build:
    name: Build, static analysis & offline verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Run static analysis (Detekt) and stand-independent tests
        run: ./gradlew clean check --no-daemon

      - name: Verify full API suite against local OpenAPI contract stub
        run: ./gradlew --continue smokeTest regressionTest allureReport -DUSE_LOCAL_MOCK=true --no-daemon

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-verification-reports
          path: |
            build/reports/detekt/**
            build/test-results/**/*.xml
            build/reports/tests/**
          if-no-files-found: warn

  api-tests:
    name: Run API tests
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.test_suite != 'none' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      TEST_PROFILE: "ci"
      BASE_URL: ${{ secrets.BASE_URL }}
      SWAGGER_URL: ${{ secrets.SWAGGER_URL }}
      AUTH_TYPE: ${{ secrets.AUTH_TYPE || 'NONE' }}
      API_TOKEN: ${{ secrets.API_TOKEN }}
      USE_LOCAL_MOCK: ${{ github.event.inputs.use_local_mock || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required stand configuration
        if: ${{ github.event.inputs.use_local_mock != 'true' }}
        run: |
          if [ -z "$BASE_URL" ] || [ -z "$SWAGGER_URL" ]; then
            echo "::error::BASE_URL and SWAGGER_URL repository secrets must be configured to run live API tests (or set use_local_mock=true)."
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Run Smoke Suite
        if: ${{ github.event.inputs.test_suite == 'smoke' }}
        run: ./gradlew --continue clean smokeTest allureReport --no-daemon

      - name: Run Regression Suite
        if: ${{ github.event.inputs.test_suite == 'regression' }}
        run: ./gradlew --continue clean regressionTest allureReport --no-daemon

      - name: Upload JUnit & Allure Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: |
            build/reports/allure-report/allureReport/index.html
            build/test-results/**/*.xml
            build/reports/tests/**
          if-no-files-found: warn
