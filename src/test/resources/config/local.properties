# Local development profile
# Note: Do NOT store real server URLs, Swagger URLs, secrets, tokens, or passwords in this file.
# Provide BASE_URL and SWAGGER_URL via environment variables, a local .env file (git-ignored),
# or JVM system properties (-DBASE_URL=... -DSWAGGER_URL=...).
AUTH_TYPE=NONE
CONNECT_TIMEOUT_MS=5000
READ_TIMEOUT_MS=15000
ALLOW_DESTRUCTIVE_TESTS=false
USE_LOCAL_MOCK=false

# Default synthetic test identifiers (override via env variables or .env for target environments)
TEST_ACTIVE_GTIN=1234567890123
TEST_ACTIVE_NTIN=0200208079406
TEST_INACTIVE_GTIN=4870207999999
TEST_DEACTIVATED_NTIN=0290000099999
