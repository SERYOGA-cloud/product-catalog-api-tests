# CI profile
# In CI, BASE_URL and SWAGGER_URL MUST be provided explicitly via environment variables
# or -DBASE_URL / -DSWAGGER_URL so tests never silently target an unintended environment.
AUTH_TYPE=NONE
CONNECT_TIMEOUT_MS=5000
READ_TIMEOUT_MS=15000
ALLOW_DESTRUCTIVE_TESTS=false
USE_LOCAL_MOCK=false

TEST_ACTIVE_GTIN=1234567890123
TEST_ACTIVE_NTIN=0200208079406
TEST_INACTIVE_GTIN=4870207999999
TEST_DEACTIVATED_NTIN=0290000099999
